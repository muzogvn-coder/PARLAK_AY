<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<title>Parlak Ay</title>
<style>
  body { font-family: Arial, sans-serif; padding: 10px; margin: 0; background: #f4f4f4; }
  .bar { display: flex; gap: 5px; margin-bottom: 10px; }
  input { flex: 1; padding: 10px; font-size: 14px; border: 1px solid #ccc; border-radius: 4px; }
  button { padding: 10px 15px; font-size: 14px; cursor: pointer; background: #007bff; color: white; border: none; border-radius: 4px; }
  button.ext { background: #28a745; }
  iframe { width: 100%; height: 500px; border: 1px solid #ccc; background: white; border-radius: 4px; }
  .info { font-size: 12px; color: #666; margin-bottom: 8px; }
</style>
</head>
<body>

<div class="bar">
  <input type="text" id="urlInput" placeholder="Adres yazın (örn: youtube.com)">
  <button onclick="goIframe()">Git</button>
  <button class="ext" onclick="goExternal()">Tarayıcıda Aç</button>
</div>

<div class="info">Not: YouTube veya Google gibi siteler ekran içinde açılmayı engellerse <b>"Tarayıcıda Aç"</b> butonunu kullanabilirsiniz.</div>

<iframe id="browserFrame"></iframe>

<script>
function getURL() {
  var val = document.getElementById('urlInput').value.trim();
  if (!val) return "";
  if (!val.startsWith('http://') && !val.startsWith('https://')) {
    val = 'https://' + val;
  }
  return val;
}

function goIframe() {
  var url = getURL();
  if (url) {
    document.getElementById('browserFrame').src = url;
  }
}

function goExternal() {
  var url = getURL();
  if (url) {
    window.open(url, '_blank');
  }
}
</script>

</body>
</html>
