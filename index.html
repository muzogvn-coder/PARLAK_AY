<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PARLAK AY</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            background-color: #121212;
            transition: background-color 0.3s;
        }
        .container {
            text-align: center;
            padding: 20px;
            margin-top: 20px;
            background: rgba(255, 255, 255, 0.95);
            border-radius: 16px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
            width: 90%;
            max-width: 500px;
        }
        .text-logo {
            font-size: 28px;
            font-weight: bold;
            padding: 10px 20px;
            border: 3px solid #111;
            display: inline-block;
            border-radius: 8px;
            margin-bottom: 15px;
            user-select: none;
            color: #111;
        }
        .controls {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-top: 10px;
            text-align: left;
        }
        .control-group {
            display: flex;
            align-items: center;
            justify-content: space-between;
            font-size: 14px;
            font-weight: bold;
            color: #333;
        }
        .control-group input[type="color"] {
            border: none;
            width: 35px;
            height: 35px;
            border-radius: 4px;
            cursor: pointer;
            background: none;
        }
        .cubuk {
            display: flex;
            gap: 8px;
            margin-top: 15px;
            width: 100%;
        }
        .cubuk input {
            flex: 1;
            padding: 10px;
            font-size: 14px;
            border: 1px solid #ccc;
            border-radius: 6px;
            outline: none;
        }
        .cubuk button {
            padding: 10px 15px;
            font-size: 14px;
            background-color: #28a745;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
        }
        .cubuk button:hover {
            background-color: #218838;
        }
        .btn-external {
            background-color: #007bff !important;
            margin-top: 8px;
            width: 100%;
        }
        .btn-external:hover {
            background-color: #0056b3 !important;
        }
        iframe {
            width: 100%;
            height: 350px;
            border: 1px solid #ccc;
            border-radius: 8px;
            margin-top: 15px;
            background: #fff;
        }
        .bilgi {
            font-size: 11px;
            color: #666;
            margin-top: 5px;
            text-align: center;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Logo / Başlık -->
        <div class="text-logo" id="brandLogo">PARLAK AY</div>

        <!-- Renk Özelleştirme Alanı -->
        <div class="controls">
            <div class="control-group">
                <label for="bgColor">Arka Plan Rengi:</label>
                <input type="color" id="bgColor" value="#ffffff">
            </div>
            <div class="control-group">
                <label for="logoColor">Logo Rengi:</label>
                <input type="color" id="logoColor" value="#111111">
            </div>
        </div>

        <!-- Arama ve URL Çubuğu -->
        <div class="cubuk">
            <input type="text" id="urlInput" placeholder="Arama yap veya URL gir (örn: google.com)">
            <button onclick="goFrame()">Git</button>
        </div>
        <button class="cubuk btn-external" onclick="goExternal()">Tarayıcıda Yeni Sekmede Aç</button>
        <div class="bilgi">Not: Bazı web siteleri güvenlik nedeniyle çerçeve içinde açılmayı engelleyebilir; bu durumda "Tarayıcıda Yeni Sekmede Aç" butonunu kullanabilirsiniz.</div>

        <!-- Arama Sonuçları İçin Çerçeve -->
        <iframe id="tarayici-cercevesi" name="tarayici-cercevesi"></iframe>
    </div>

    <script>
        // Renk Değiştirme Fonksiyonları
        const bgColorInput = document.getElementById('bgColor');
        const logoColorInput = document.getElementById('logoColor');
        const brandLogo = document.getElementById('brandLogo');

        bgColorInput.addEventListener('input', (e) => {
            document.body.style.backgroundColor = e.target.value;
        });

        logoColorInput.addEventListener('input', (e) => {
            brandLogo.style.color = e.target.value;
            brandLogo.style.borderColor = e.target.value;
        });

        // Arama ve URL Yönlendirme Fonksiyonları
        function urlYiAl() {
            let val = document.getElementById('urlInput').value.trim();
            if (!val) return '';
            
            // Eğer https:// veya http:// ile başlamıyorsa kontrol et
            if (!val.startsWith('http://') && !val.startsWith('https://')) {
                // Eğer uzantı yoksa (nokta içermiyorsa) Google'da arat
                if (!val.includes('.')) {
                    val = 'https://www.google.com/search?q=' + encodeURIComponent(val);
                } else {
                    val = 'https://' + val;
                }
            }
            return val;
        }

        function goFrame() {
            let url = urlYiAl();
            if (url) {
                document.getElementById('tarayici-cercevesi').src = url;
            }
        }

        function goExternal() {
            let url = urlYiAl();
            if (url) {
                window.open(url, '_blank');
            }
        }
    </script>
</body>
</html>
