<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PARLAK AY - 3D Akıllı Tarayıcı</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            min-height: 100vh;
            background: radial-gradient(circle at center, #1b2735 0%, #090a0f 100%);
            color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
            overflow-x: hidden;
        }

        /* 3 Boyutlu Parlayan ve Dönen Ay Tasarımı */
        .moon-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-bottom: 25px;
        }

        .moon-3d {
            width: 140px;
            height: 140px;
            border-radius: 50%;
            background: radial-gradient(circle at 35% 35%, #ffffff 0%, #e2e8f0 30%, #64748b 70%, #0f172a 100%);
            box-shadow: 
                inset -25px -25px 40px rgba(0, 0, 0, 0.9),
                inset 10px 10px 22px rgba(255, 255, 255, 0.95),
                0 0 45px rgba(255, 255, 255, 0.45),
                0 0 90px rgba(129, 140, 248, 0.35);
            animation: floatMoon 4s ease-in-out infinite;
            position: relative;
        }

        @keyframes floatMoon {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-10px); }
        }

        .brand-title {
            margin-top: 18px;
            font-size: 30px;
            font-weight: 900;
            letter-spacing: 6px;
            text-transform: uppercase;
            text-shadow: 0 0 20px rgba(255, 255, 255, 0.7);
            text-align: center;
        }

        /* Arama Çubuğu */
        .search-box {
            display: flex;
            width: 100%;
            max-width: 550px;
            background: rgba(255, 255, 255, 0.12);
            border: 1px solid rgba(255, 255, 255, 0.3);
            border-radius: 50px;
            padding: 8px;
            backdrop-filter: blur(15px);
            box-shadow: 0 12px 35px rgba(0, 0, 0, 0.6);
            margin-bottom: 20px;
        }

        .search-box input {
            flex: 1;
            background: transparent;
            border: none;
            padding: 12px 22px;
            font-size: 16px;
            color: #ffffff;
            outline: none;
        }

        .search-box input::placeholder {
            color: rgba(255, 255, 255, 0.6);
        }

        .search-box button {
            background: #ffffff;
            color: #0f172a;
            border: none;
            padding: 12px 30px;
            border-radius: 40px;
            font-size: 15px;
            font-weight: 800;
            cursor: pointer;
            transition: transform 0.2s, background 0.2s;
        }

        .search-box button:hover {
            background: #e2e8f0;
            transform: scale(1.03);
        }

        /* Hızlı Kısayol Butonları */
        .quick-tags {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            justify-content: center;
            max-width: 600px;
        }

        .tag {
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.2);
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .tag:hover {
            background: rgba(255, 255, 255, 0.25);
            border-color: rgba(255, 255, 255, 0.5);
        }
    </style>
</head>
<body>

    <div class="moon-container">
        <div class="moon-3d"></div>
        <div class="brand-title">PARLAK AY</div>
    </div>

    <div class="search-box">
        <input type="text" id="userInput" placeholder="Ne aramak istiyorsun? (örn: Sevda Papağanı)" onkeypress="enterKontrol(event)" autofocus>
        <button onclick="aramaYap()">Bul</button>
    </div>

    <div class="quick-tags">
        <span class="tag" onclick="hizliAra('Sevda Papağanı')">🦜 Sevda Papağanı</span>
        <span class="tag" onclick="hizliAra('Hint Bülbülü')">🐦 Hint Bülbülü</span>
        <span class="tag" onclick="hizliAra('Lepistes Balığı')">🐠 Lepistes</span>
        <span class="tag" onclick="hizliAra('YouTube')">▶️ YouTube</span>
    </div>

    <script>
        function hizliAra(terim) {
            document.getElementById('userInput').value = terim;
            aramaYap();
        }

        function enterKontrol(e) {
            if (e.key === 'Enter') {
                aramaYap();
            }
        }

        function aramaYap() {
            let metin = document.getElementById('userInput').value.trim();
            if (!metin) return;

            let url = '';

            // Eğer doğrudan web sitesi adresi yazıldıysa
            if (metin.startsWith('http://') || metin.startsWith('https://')) {
                url = metin;
            } else if (metin.includes('.') && !metin.includes(' ')) {
                url = 'https://' + metin;
            } else {
                // Yazılan konuyu doğrudan Google üzerinde anında aratıp açar (Hata vermez, %100 çalışır)
                url = 'https://www.google.com/search?q=' + encodeURIComponent(metin);
            }

            window.location.href = url;
        }
    </script>
</body>
</html>
